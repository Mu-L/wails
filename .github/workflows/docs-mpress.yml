name: Wails v3 documentation

on:
  pull_request:
    paths: ['docs/mpress/**', 'mpress.yaml', '.github/workflows/docs-mpress.yml']
  push:
    paths: ['docs/mpress/**', 'mpress.yaml', '.github/workflows/docs-mpress.yml']
  workflow_dispatch:
    inputs:
      deployment:
        description: Deployment target after validation
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

concurrency:
  group: docs-mpress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build and validate with M-Press v1.0.3
        run: bash docs/mpress/scripts/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wails-v3-docs
          path: docs/mpress/site/
          if-no-files-found: error

  deploy:
    needs: build
    if: vars.WAILS_DOCS_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: docs-cloudflare
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wails-v3-docs
          path: site
      - name: Deploy the validated static artifact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c9e2228ddc647134653521013b0ea7dc
          DEPLOYMENT: ${{ inputs.deployment || 'production' }}
        run: |
          branch="validation-${GITHUB_RUN_ID}"
          if [ "$DEPLOYMENT" = production ]; then branch=master; fi
          npx --yes wrangler@4.124.0 pages deploy site --project-name wails-v3-docs --branch "$branch" --commit-hash "$GITHUB_SHA"
